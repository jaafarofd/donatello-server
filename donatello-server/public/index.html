<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donatello Multiplayer Test</title><style>body{background:#160c25;color:#f5e6c5;font:16px system-ui;margin:2rem auto;max-width:800px;padding:0 1rem}button,input,select{padding:10px;margin:4px;background:#27163b;color:white;border:1px solid #a88643;border-radius:7px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c0815;padding:16px;min-height:180px}h1{color:#e9c36d}</style><h1>♛ Donatello — Multiplayer Test</h1><p>واجهة اختبار فقط، ليست لعبة البلياردو الأصلية.</p><input id="token" style="width:90%" placeholder="Authentication token"><button onclick="connect()">اتصال</button><hr><input id="room" placeholder="اسم الغرفة"><button onclick="send('create',{name:room.value})">إنشاء غرفة</button><button onclick="send('list')">عرض الغرف</button><input id="roomid" placeholder="Room ID"><button onclick="send('join',{roomId:roomid.value})">دخول</button><button onclick="send('spectate',{roomId:roomid.value})">مشاهدة</button><button onclick="send('leave')">خروج</button><hr><input id="message" placeholder="رسالة"><select id="scope"><option value="lobby">عامة</option><option value="room">الغرفة</option></select><button onclick="send('chat',{scope:scope.value,text:message.value})">إرسال</button><input id="to" placeholder="معرّف اللاعب"><button onclick="send('private',{to:to.value,text:message.value})">خاص</button><button onclick="send('invite',{to:to.value})">دعوة</button><hr><pre id="log"></pre><script>let ws;const log=document.getElementById('log');function add(s){log.textContent=String(s)+'\n'+log.textContent}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>send('auth',{token:token.value});ws.onmessage=e=>add(e.data);ws.onclose=e=>add('Disconnected: '+e.code)}function send(type,data={}){if(ws?.readyState===1)ws.send(JSON.stringify({type,...data}));else add('Connect first')}</script></html>
